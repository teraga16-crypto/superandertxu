name: Avisos

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      - name: Enviar avisos
        run: node notifier/send.mjs
        env:
          FAMILY_PIN: ${{ secrets.FAMILY_PIN }}
      # GitHub pausa las tareas programadas si el proyecto no cambia en 60 días.
      - name: Mantener los avisos activos
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( ($(date +%s) - last) / 86400 )) -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Mantener avisos activos"
            git push
          fi
