<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>SUPERANDERTXU</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SUPERANDERTXU">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151517" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=4">
<link rel="icon" href="icon-192.png?v=4">
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1c1c1e; --muted:#6e6e73; --line:#e5e3de;
  --accent:#e4572e; --soft:#efede8; --danger:#d92d20; --ok:#1a9e5a;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 10px rgba(0,0,0,.04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#151517;--card:#202023;--ink:#f2f2f4;--muted:#9a9aa1;--line:#323236;
  --soft:#2a2a2e;--accent:#ff7a50;--shadow:none;color-scheme:dark}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 0;min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
.top{display:flex;align-items:center;gap:10px}
.brand{font-weight:800;letter-spacing:.04em;font-size:19px;flex:1}
.brand span{color:var(--accent)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--soft)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-top:10px}
.seg button{flex:1;padding:8px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;display:flex;align-items:center;gap:6px;padding:6px 11px 6px 7px;border-radius:999px;
  background:var(--card);border:1.5px solid var(--line);font-size:14px;font-weight:600;color:var(--muted)}
.fchip.on{border-color:var(--c,var(--ink));color:var(--ink);background:color-mix(in srgb,var(--c,#888) 14%,var(--card))}
.fchip.plain{padding-left:11px}
.dot{width:18px;height:18px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:11px;color:#fff;flex:none}
.dot.none{background:transparent;border:1.5px dashed var(--muted)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px;font-weight:700}
h2 .when{text-transform:none;letter-spacing:0;font-weight:500}
h2.late{color:var(--danger)}
.item{display:flex;gap:12px;align-items:stretch;background:var(--card);border-radius:14px;padding:11px 12px 11px 0;
  margin-bottom:8px;box-shadow:var(--shadow);position:relative;overflow:hidden;width:100%;text-align:left}
.bar{width:6px;flex:none;border-radius:0 4px 4px 0;background:var(--bar)}
.bar.none{background:repeating-linear-gradient(180deg,var(--muted) 0 4px,transparent 4px 8px);opacity:.55}
.time{width:50px;flex:none;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.time small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.time .allday{font-size:12px;color:var(--muted);font-weight:600;line-height:1.2}
.body{flex:1;min-width:0}
.title{font-weight:600;word-break:break-word}
.meta{font-size:13px;color:var(--muted);margin-top:2px}
.who{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px 2px 3px;border-radius:999px;
  background:color-mix(in srgb,var(--c) 16%,transparent);color:color-mix(in srgb,var(--c) 75%,var(--ink))}
.pchip .dot{width:16px;height:16px;font-size:10px}
.pchip.none{background:transparent;border:1.5px dashed var(--line);color:var(--muted);padding-left:8px}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex:none;align-self:center;display:grid;place-items:center;
  font-size:16px;color:#fff;margin-left:4px}
.item.done .check{background:var(--ok);border-color:var(--ok)}
.item.done .title{text-decoration:line-through;color:var(--muted)}
.item.past{opacity:.5}
.empty{color:var(--muted);text-align:center;padding:14px;font-size:14px;background:var(--card);border-radius:14px;opacity:.8}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(228,87,46,.4);z-index:6}
/* Mes */
.mhead{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}
.mhead b{font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wd{font-size:11px;text-align:center;color:var(--muted);font-weight:700;padding:4px 0}
.cell{aspect-ratio:1/1.12;background:var(--card);border-radius:9px;padding:4px 3px;display:flex;flex-direction:column;align-items:center;
  gap:2px;font-size:14px;font-weight:600;border:2px solid transparent;overflow:hidden}
.cell.out{opacity:.35}
.cell.today .n{background:var(--accent);color:#fff}
.cell.hol .n{color:var(--danger);font-weight:800}
.cell.hol{background:color-mix(in srgb,var(--danger) 7%,var(--card))}
.holtag{text-transform:none;letter-spacing:0;color:var(--danger);font-weight:700}
.switch{width:22px;height:22px;accent-color:var(--accent)}
.cell.sel{border-color:var(--ink)}
.cell .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px}
.ticks{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:100%}
.tk{width:9px;height:9px;border-radius:50%;background:var(--c)}
.tk.none{background:transparent;border:1px solid var(--muted)}
.more{font-size:9px;color:var(--muted);font-weight:700}
/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:8px 16px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.shead b{font-size:18px}
.link{color:var(--accent);font-weight:600;font-size:16px}
.field{background:var(--card);border-radius:12px;margin-bottom:10px;padding:2px 12px}
.row{display:flex;align-items:center;gap:10px;min-height:46px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row label{flex:1;color:var(--muted);font-size:15px}
.row input,.row select{border:0;background:transparent;text-align:right;min-width:0;outline:none;font-size:16px}
.row input[type=date],.row input[type=time]{min-height:34px}
input.big{width:100%;border:0;background:transparent;font-size:18px;font-weight:600;padding:12px 0;outline:none}
textarea{width:100%;border:0;background:transparent;padding:12px 0;outline:none;resize:none;min-height:60px}
.lbl{font-size:13px;font-weight:700;color:var(--muted);margin:14px 4px 6px;text-transform:uppercase;letter-spacing:.05em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:8px 12px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.opt.on{border-color:var(--c,var(--ink));background:color-mix(in srgb,var(--c,#888) 16%,var(--card))}
.days{display:flex;gap:5px;padding:8px 0}
.days button{flex:1;height:36px;border-radius:10px;background:var(--soft);font-weight:700;font-size:14px}
.days button.on{background:var(--ink);color:var(--bg)}
.clear{color:var(--muted);font-size:18px;padding:0 2px}
.btn{width:100%;padding:14px;border-radius:14px;font-weight:700;font-size:17px;background:var(--accent);color:#fff;margin-top:12px}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger)}
.note{font-size:13px;color:var(--muted);margin:6px 4px;line-height:1.45}
.ok{color:var(--ok);font-weight:700}
.person{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.person input[type=text]{flex:1;border:0;background:transparent;outline:none;font-weight:600;min-width:0}
.person input.emo{width:38px;text-align:center;flex:none;font-size:18px}
.person input[type=color]{width:34px;height:30px;border:0;padding:0;background:none;flex:none}
.badge{font-size:12px;background:var(--soft);padding:3px 8px;border-radius:8px;color:var(--muted)}
/* PIN */
.pin{min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px}
.pin h1{margin:0;font-size:26px;letter-spacing:.04em}
.pin h1 span{color:var(--accent)}
.pdots{display:flex;gap:12px;height:20px}
.pdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.pdots i.f{background:var(--ink);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pad button{height:76px;border-radius:50%;background:var(--card);font-size:28px;font-weight:500;box-shadow:var(--shadow)}
.pad button.x{background:transparent;box-shadow:none;font-size:17px;color:var(--muted)}
.err{color:var(--danger);min-height:20px;font-weight:600;text-align:center}
.banner{background:color-mix(in srgb,var(--accent) 12%,var(--card));border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:40;animation:fade .2s;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
